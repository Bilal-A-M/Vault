<span style="font-size: 17px; font-weight: 600">Hiba</span>
</button>
</div>

<div role="status" style="border-radius: 18px; padding: 16px; background: #121215; border: 1px solid rgba(226,194,125,.22); display: flex; align-items: center; gap: 14px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(226,194,125,.14); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2C27D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
