<!doctype html>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#D4B36A}a:hover{color:#E6CB8C}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0D; color: #F5F3EE; font-family: Inter, system-ui, sans-serif; padding: 72px 20px 40px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Who's using this phone?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #A09E98">Deposits you add here will be yours by default. You can change this later in Settings.</p>
</div>

<div role="group" aria-label="This phone belongs to" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button aria-pressed="true" style="position: relative; padding: 28px 12px 22px; border-radius: 20px; border: 1.5px solid #9CC2B9; background: #1F1F25; color: #F5F3EE; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 14px">
<span style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: #9CC2B9; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
<span style="width: 84px; height: 84px; border-radius: 50%; background: #9CC2B9; color: #0B0B0D; font-size: 34px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
<span style="font-size: 19px; font-weight: 600">Bilal</span>
</button>
<button aria-pressed="false" style="padding: 28px 12px 22px; border-radius: 20px; border: 1px solid rgba(255,255,255,.08); background: #16161A; color: #F5F3EE; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 14px">
<span style="width: 84px; height: 84px; border-radius: 50%; background: #1F1F25; border: 1px solid #B9806B; box-sizing: border-box; color: #B9806B; font-size: 34px; font-weight: 600; display: flex; align-items: center; justify-content: center">H</span>
<span style="font-size: 19px; font-weight: 600">Hiba</span>
</button>
</div>

<div style="background: #16161A; border: 1px solid rgba(212,179,106,.45); border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(212,179,106,.16); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4B36A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">You're all set, Bilal</span><span style="font-size: 13px; line-height: 1.4; color: #A09E98">Shown after you tap your name, before the dashboard opens.</span></div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 20px">
<div aria-label="Step 3 of 3" role="img" style="display: flex; gap: 6px">
<span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2)"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2)"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #D4B36A"></span>
</div>
<a href="Main.dc.html" style="box-sizing: border-box; width: 100%; height: 54px; border-radius: 14px; background: #D4B36A; color: #0B0B0D; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Open Vault</a>
