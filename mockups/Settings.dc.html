<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#D4B36A}a:hover{color:#E6CB8C}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #0B0B0D; color: #F5F3EE; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 60px 20px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1">

<h1 style="margin: 0 0 6px; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Settings</h1>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #A09E98; margin-top: 8px">PEOPLE</span>
<div style="background: #16161A; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column">
<button style="min-height: 64px; padding: 0; border: 0; border-bottom: 1px solid rgba(255,255,255,.08); background: none; color: #F5F3EE; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #1F1F25; border: 1px solid #9CC2B9; box-sizing: border-box; color: #9CC2B9; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Bilal</span><span style="font-size: 13px; color: #A09E98">Teal</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A09E98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>
<button style="min-height: 64px; padding: 0; border: 0; background: none; color: #F5F3EE; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #1F1F25; border: 1px solid #B9806B; box-sizing: border-box; color: #B9806B; font-weight: 600; display: flex; align-items: center; justify-content: center">H</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Hiba</span><span style="font-size: 13px; color: #A09E98">Coral</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A09E98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>
</div>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #A09E98; margin-top: 12px">THIS PHONE BELONGS TO</span>
<div role="group" aria-label="This phone belongs to" style="display: flex; padding: 4px; background: #16161A; border: 1px solid rgba(255,255,255,.08); border-radius: 14px">
<button aria-pressed="true" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #1F1F25; color: #F5F3EE; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: inset 0 0 0 1.5px #9CC2B9">Bilal</button>
<button aria-pressed="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; color: #A09E98; font-family: inherit; font-size: 15px; font-weight: 500">Hiba</button>
</div>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #A09E98; margin-top: 12px">NOTIFICATIONS</span>
<div style="background: #16161A; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column">
<div style="min-height: 64px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Deposit alerts</span><span style="font-size: 13px; color: #A09E98">When Hiba adds or withdraws</span></span>
<button role="switch" aria-checked="true" aria-label="Deposit alerts" style="width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: #D4B36A; display: flex; justify-content: flex-end"><span style="width: 26px; height: 26px; border-radius: 50%; background: #0B0B0D"></span></button>
</div>
<div style="min-height: 64px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Milestone alerts</span><span style="font-size: 13px; color: #A09E98">At 25, 50, 75 and 100%</span></span>
<button role="switch" aria-checked="false" aria-label="Milestone alerts" style="width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: #3A3A44; display: flex; justify-content: flex-start"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F5F3EE"></span></button>
</div>
</div>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #A09E98; margin-top: 12px">APPEARANCE</span>
<div role="group" aria-label="Appearance" style="display: flex; padding: 4px; background: #16161A; border: 1px solid rgba(255,255,255,.08); border-radius: 14px">
<button aria-pressed="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; color: #A09E98; font-family: inherit; font-size: 15px; font-weight: 500">System</button>
<button aria-pressed="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; color: #A09E98; font-family: inherit; font-size: 15px; font-weight: 500">Light</button>
<button aria-pressed="true" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #2A2A32; color: #F5F3EE; font-family: inherit; font-size: 15px; font-weight: 600">Dark</button>
</div>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #A09E98; margin-top: 12px">DEBUG · PREVIEW A CELEBRATION</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: #1F1F25; color: #F5F3EE; font-family: inherit; font-size: 15px; font-weight: 500">25%</button>
<button style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: #1F1F25; color: #F5F3EE; font-family: inherit; font-size: 15px; font-weight: 500">50%</button>
<button style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: #1F1F25; color: #F5F3EE; font-family: inherit; font-size: 15px; font-weight: 500">75%</button>
<a href="Celebration.dc.html" style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(212,179,106,.45); background: rgba(212,179,106,.16); color: #D4B36A; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">100%</a>
</div>

<div style="background: #16161A; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 0 16px; margin-top: 14px; min-height: 56px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 16px; font-weight: 500">About Vault</span>
<span style="font-size: 15px; color: #A09E98">Version 0.1</span>
</div>

</div>

<a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; color: #A09E98; font-size: 11px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</a>
<a href="Goals.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; color: #A09E98; font-size: 11px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</a>
<a href="Insights.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; color: #A09E98; font-size: 11px; font-weight: 500; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Insights</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; color: #D4B36A; font-size: 11px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</a>
</nav>
</div>
