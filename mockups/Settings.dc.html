<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:#D9DDE3}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 1100px; box-sizing: border-box; background: #000000; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; overflow: hidden">
<div style="position: relative; padding: 106px 16px 124px; display: flex; flex-direction: column; gap: 8px">

<h1 style="margin: 0 4px 10px; font-size: 34px; font-weight: 700; letter-spacing: 0.2px; line-height: 1.15">Settings</h1>

<h2 style="margin: 12px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">People</h2>
<div style="border-radius: 12px; background: #1C1C1E; padding-left: 16px; display: flex; flex-direction: column">
<button style="min-height: 60px; padding: 0 16px 0 0; border: 0; border-bottom: 0.5px solid rgba(255,255,255,.14); background: none; color: #F3F4F6; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #8FD3E0, #5B8FD9); color: #07131C; font-family: Sora, Inter, sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
<span style="flex: 1; font-size: 17px">Bilal</span><span style="font-size: 17px; color: #A3A7AE">Sky</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8F97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>
<button style="min-height: 60px; padding: 0 16px 0 0; border: 0; background: none; color: #F3F4F6; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #E9B3B9, #C9789A); color: #22090F; font-family: Sora, Inter, sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: center">H</span>
<span style="flex: 1; font-size: 17px">Hiba</span><span style="font-size: 17px; color: #A3A7AE">Rose</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8F97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>
</div>

<h2 style="margin: 18px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">This phone belongs to</h2>
<div role="radiogroup" aria-label="This phone belongs to" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 2px; border-radius: 9px; background: rgba(118,118,128,.24)">
<button role="radio" aria-checked="true" style="min-height: 34px; border: 0; border-radius: 7px; background: #636366; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Bilal</button>
<button role="radio" aria-checked="false" style="min-height: 34px; border: 0; border-radius: 7px; background: none; color: #F3F4F6; font-family: inherit; font-size: 13px">Hiba</button>
</div>

<h2 style="margin: 18px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">Notifications</h2>
<div style="border-radius: 12px; background: #1C1C1E; padding-left: 16px; display: flex; flex-direction: column">
<div style="min-height: 44px; padding: 11px 16px 11px 0; border-bottom: 0.5px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 17px">When Hiba adds money</span>
<button role="switch" aria-checked="true" aria-label="When Hiba adds money" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: #30D158; display: flex; justify-content: flex-end"><span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.25)"></span></button>
</div>
<div style="min-height: 44px; padding: 11px 16px 11px 0; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 17px">Milestones</span>
<button role="switch" aria-checked="false" aria-label="Milestones" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: rgba(120,120,128,.32); display: flex; justify-content: flex-start"><span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.25)"></span></button>
</div>
</div>
<p style="margin: 0 16px; font-size: 13px; line-height: 1.4; color: #A3A7AE">Milestones are 25, 50, 75 and 100% of a goal.</p>

<h2 style="margin: 18px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">Appearance</h2>
<div role="radiogroup" aria-label="Appearance" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px; border-radius: 9px; background: rgba(118,118,128,.24)">
<button role="radio" aria-checked="true" style="min-height: 34px; border: 0; border-radius: 7px; background: #636366; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">System</button>
<button role="radio" aria-checked="false" style="min-height: 34px; border: 0; border-radius: 7px; background: none; color: #F3F4F6; font-family: inherit; font-size: 13px">Light</button>
<button role="radio" aria-checked="false" style="min-height: 34px; border: 0; border-radius: 7px; background: none; color: #F3F4F6; font-family: inherit; font-size: 13px">Dark</button>
</div>

<h2 style="margin: 18px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">Sharing</h2>
<div style="border-radius: 12px; background: #1C1C1E; padding-left: 16px; display: flex; flex-direction: column">
<div style="min-height: 44px; padding: 11px 16px 11px 0; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 17px">iCloud sync</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 17px; color: #A3A7AE">Up to date</span>
</div>
</div>

<h2 style="margin: 18px 16px 0; font-size: 13px; font-weight: 400; color: #A3A7AE; text-transform: uppercase">Preview (debug)</h2>
<div style="border-radius: 12px; background: #1C1C1E; padding-left: 16px; display: flex; flex-direction: column">
<button style="min-height: 44px; padding: 0 16px 0 0; border: 0; border-bottom: 0.5px solid rgba(255,255,255,.14); background: none; color: #D9DDE3; font-family: inherit; font-size: 17px; text-align: left">Show 25% celebration</button>
<button style="min-height: 44px; padding: 0 16px 0 0; border: 0; border-bottom: 0.5px solid rgba(255,255,255,.14); background: none; color: #D9DDE3; font-family: inherit; font-size: 17px; text-align: left">Show 50% celebration</button>
<button style="min-height: 44px; padding: 0 16px 0 0; border: 0; border-bottom: 0.5px solid rgba(255,255,255,.14); background: none; color: #D9DDE3; font-family: inherit; font-size: 17px; text-align: left">Show 75% celebration</button>
<a href="Celebration.dc.html" style="min-height: 44px; padding-right: 16px; font-size: 17px; text-decoration: none; display: flex; align-items: center">Show 100% celebration</a>
</div>

<div style="margin-top: 18px; border-radius: 12px; background: #1C1C1E; padding: 0 16px; min-height: 44px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 17px">About Vault</span>
<span style="font-size: 17px; color: #A3A7AE">Version 0.1</span>
</div>

<a href="Settings.dc.html" aria-current="page" style="min-height: 44px; color: #FFFFFF; font-size: 11px; font-weight: 700; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</a>
