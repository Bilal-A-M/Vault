# XcodeGen spec. Run `xcodegen generate` in this folder, then open Vault.xcodeproj.
name: Vault
options:
  bundleIdPrefix: com.vault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Vault:
    type: application
    platform: iOS
    sources:
      - Vault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vault.app
        PRODUCT_NAME: Vault
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Vault
        ENABLE_PREVIEWS: YES
